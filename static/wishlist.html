<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>My Wishlist - Cartify</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="./style.css"/>
  <style>
    .wishlist-header {
      text-align: left;
      margin-bottom: 2rem;
      padding: 0 1rem;
    }
    
    .wishlist-header h1 {
      color: var(--text-primary);
      margin: 0 0 0.5rem 0;
      font-size: 2.5rem;
      font-weight: 600;
    }
    
    .wishlist-header p {
      color: var(--text-secondary);
      margin: 0;
      font-size: 1.1rem;
    }
    
    .wishlist-stats {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    
    .stat-card {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      text-align: center;
      width: 100%;
    }
    
    .stat-number {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent-bg);
      margin-bottom: 0.5rem;
    }
    
    .stat-label {
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 500;
    }
    
    .wishlist-actions {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    
    .action-btn {
      background: var(--accent-bg);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
    }
    
    .action-btn:hover {
      background: var(--accent-secondary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }
    
    .action-btn.secondary {
      background: var(--text-muted);
    }
    
    .action-btn.secondary:hover {
      background: var(--text-secondary);
    }
    
    .empty-wishlist {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }
    
    .empty-wishlist h3 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: var(--text-secondary);
    }
    
    .empty-wishlist p {
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }
    
    .empty-wishlist .btn {
      background: var(--accent-bg);
      color: white;
      text-decoration: none;
      padding: 1rem 2rem;
      border-radius: 8px;
      font-weight: 500;
      display: inline-block;
      transition: all 0.3s ease;
    }
    
    .empty-wishlist .btn:hover {
      background: var(--accent-secondary);
      transform: translateY(-2px);
    }
    
    .wishlist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }
    
    .wishlist-item {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: all 0.3s ease;
      width: 100%;
    }
    
    .wishlist-item:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-xl);
    }
    
    .wishlist-item-header {
      padding: 1.5rem 1.5rem 1rem 1.5rem;
      border-bottom: 1px solid var(--border-light);
    }
    
    .wishlist-item-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
      line-height: 1.4;
    }
    
    .wishlist-item-meta {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }
    
    .wishlist-item-price {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent-bg);
    }
    
    .wishlist-item-body {
      padding: 1rem 1.5rem;
    }
    
    .wishlist-item-description {
      color: var(--text-secondary);
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 1rem;
    }
    
    .wishlist-item-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    
    .wishlist-item-actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    
    .wishlist-item-btn {
      flex: 1;
      padding: 0.75rem;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      min-width: 100px;
    }
    
    .wishlist-item-btn.primary {
      background: var(--accent-bg);
      color: white;
    }
    
    .wishlist-item-btn.primary:hover {
      background: var(--accent-secondary);
    }
    
    .wishlist-item-btn.secondary {
      background: var(--text-muted);
      color: white;
    }
    
    .wishlist-item-btn.secondary:hover {
      background: var(--text-secondary);
    }
    
    .wishlist-item-btn.danger {
      background: var(--error);
      color: white;
    }
    
    .wishlist-item-btn.danger:hover {
      background: #dc2626;
    }
    
    .loading {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
    }
    
    .loading-spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid var(--border-light);
      border-radius: 50%;
      border-top-color: var(--accent-bg);
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 1rem;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    @media (max-width: 768px) {
      .wishlist-container {
        flex-direction: column;
        gap: 1rem;
      }
      
      .wishlist-sidebar {
        width: 100%;
      }
      
      .wishlist-stats {
        flex-direction: row;
        gap: 1rem;
      }
      
      .stat-card {
        padding: 1rem;
        flex: 1;
      }
      
      .wishlist-actions {
        flex-direction: row;
        gap: 0.75rem;
      }
      
      .action-btn {
        flex: 1;
      }
      
      .wishlist-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="brand">🧭 Cartify</div>
    <div class="search-container">
      <a href="./index.html" class="action-btn secondary" style="text-decoration: none; display: inline-block;">← Back to Shop</a>
    </div>
    <div class="user-menu">
      <span id="userInfo" class="user-info"></span>
      <button id="logoutBtn" class="logout-btn" title="Logout">Logout</button>
    </div>
  </header>

  <main class="layout">
    <div class="wishlist-container" style="display: flex; max-width: 1400px; margin: 0 auto; padding: 2rem; gap: 2rem;">
      
      <!-- Sidebar -->
      <aside class="wishlist-sidebar" style="width: 300px; flex-shrink: 0;">
        <div class="wishlist-header">
          <h1>💖 My Wishlist</h1>
          <p>Your saved products and favorites</p>
        </div>
        
        <div class="wishlist-stats" id="wishlistStats" style="display: none;">
          <div class="stat-card">
            <div class="stat-number" id="totalItems">0</div>
            <div class="stat-label">Total Items</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="totalValue">$0</div>
            <div class="stat-label">Total Value</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="avgRating">0.0</div>
            <div class="stat-label">Avg Rating</div>
          </div>
        </div>
        
        <div class="wishlist-actions" id="wishlistActions" style="display: none;">
          <button class="action-btn" id="clearAllBtn">Clear All</button>
          <button class="action-btn secondary" id="exportBtn">Export List</button>
          <button class="action-btn secondary" id="sortBtn">Sort by Price</button>
        </div>
      </aside>
      
      <!-- Main Content -->
      <div class="wishlist-main" style="flex: 1;">
        <div id="loadingMessage" class="loading">
          <div class="loading-spinner"></div>
          <p>Loading your wishlist...</p>
        </div>
        
        <div id="emptyWishlist" class="empty-wishlist" style="display: none;">
          <h3>Your wishlist is empty</h3>
          <p>Start adding products to your wishlist to see them here!</p>
          <a href="./index.html" class="btn">Browse Products</a>
        </div>
        
        <div id="wishlistGrid" class="wishlist-grid" style="display: none;"></div>
      </div>
    </div>
  </main>

  <div id="modal" class="modal" style="display: none;">
    <div class="dialog">
      <button id="modalClose" class="close">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="./wishlist.js"></script>
</body>
</html>
